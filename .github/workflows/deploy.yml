name: Deploy ke TinkerHost

# ---------------------------------------------------------------
#  Deploy otomatis ke TinkerHost lewat FTP.
#
#  TinkerHost tidak menyediakan terminal/SSH, jadi tidak bisa
#  "git pull" di server. Sebagai gantinya, file diambil dari
#  git archive lalu dikirim lewat FTP dari runner GitHub.
#
#  Karena sumbernya git archive, isinya PERSIS sama dengan isi
#  repository: config/config.php, backups/, dan .git/ tidak ikut.
# ---------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode latihan - daftar file tanpa meng-upload"
        type: boolean
        default: true

# Cegah dua deploy berjalan bersamaan.
concurrency:
  group: deploy-tinkerhost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload ke hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Susun daftar file dari git
        run: |
          set -euo pipefail

          echo "Commit : $(git log -1 --pretty=format:'%h %s')" >> "$GITHUB_STEP_SUMMARY"
          echo "Waktu  : $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # git archive hanya mengambil berkas yang benar-benar di-commit.
          git archive --format=tar HEAD | tar -x -C .

          # Pengaman: kredensial tidak boleh ikut terkirim.
          if [ -f config/config.php ]; then
            echo "::error::config/config.php ikut terambil. Deploy dibatalkan."
            exit 1
          fi

          JUMLAH=$(find . -type f -not -path './.git/*' | wc -l)
          UKURAN=$(du -sh --exclude=.git . | cut -f1)

          {
            echo "Jumlah file : $JUMLAH"
            echo "Total ukuran: $UKURAN"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "<details><summary>Daftar file ($JUMLAH)</summary><pre>"
            find . -type f -not -path './.git/*' | sed 's|^\./||' | sort
            echo "</pre></details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Siap meng-upload $JUMLAH file ($UKURAN)."

      - name: Periksa secret
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -euo pipefail

          # Secret dibaca lewat env. GitHub Actions tidak mendukung
          # nama secret yang berubah-ubah seperti secrets.$NAMA.
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ] || [ -z "$FTP_PATH" ]; then
            echo "::error::Secret belum lengkap. Buka Settings > Secrets and variables > Actions, lalu isi FTP_HOST, FTP_USER, FTP_PASS, dan FTP_PATH."
            exit 1
          fi

          echo "Secret lengkap. Host: $FTP_HOST, tujuan: $FTP_PATH"

      - name: Periksa folder tujuan
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -uo pipefail

          # Folder tujuan adalah kesalahan paling sering: TinkerHost Free
          # memakai "htdocs", sedangkan "public_html" hanya untuk paket Pro.
          # Salah path membuat SEMUA file gagal, jadi dicek lebih dulu.
          if curl --user "$FTP_USER:$FTP_PASS" \
                  --ssl --list-only "ftp://$FTP_HOST/${FTP_PATH%/}/" 2>/tmp/galat-folder; then
            echo "Folder $FTP_PATH ada dan bisa diakses."
          else
            echo "::error::Folder '$FTP_PATH' tidak bisa diakses di $FTP_HOST"
            sed 's/^/  /' /tmp/galat-folder
            {
              echo ""
              echo "### Folder tujuan tidak ditemukan"
              echo ""
              echo "| Paket | FTP host | Folder |"
              echo "|---|---|---|"
              echo "| Free (gratis) | \`ftpupload.net\` | \`/htdocs\` |"
              echo "| Pro (berbayar) | \`ftp.pro.tinkerhost.net\` | \`/public_html\` |"
              echo ""
              echo "Perbaiki secret \`FTP_PATH\`, lalu jalankan ulang."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Kirim lewat FTP
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -uo pipefail

          # --user dipakai, bukan kredensial yang disisipkan ke URL, supaya
          # password dengan karakter khusus tetap aman.
          HOST="${FTP_HOST%/}"
          PATH_REMOTE="${FTP_PATH%/}"
          SUKES=0
          GAGAL=0
          BERKAS_GAGAL=""

          # Opsi bersama untuk setiap curl.
          OPSI=(--user "$FTP_USER:$FTP_PASS" --ftp-create-dirs --ssl
                --silent --show-error --fail --connect-timeout 20 --max-time 300)

          # Kirim satu berkas. Kalau gagal, coba hapus dulu file lama di
          # server lalu ulangi - sebagian server menolak menimpa berkas
          # yang sudah ada dan membalas 451.
          kirim() {
            berkas="$1"; relatif="$2"
            tujuan="ftp://$HOST$PATH_REMOTE/$relatif"

            if curl "${OPSI[@]}" -T "$berkas" "$tujuan" 2>/tmp/galat-curl; then
              return 0
            fi

            curl --user "$FTP_USER:$FTP_PASS" --ssl \
                 -Q "DELE $PATH_REMOTE/$relatif" \
                 --list-only "ftp://$HOST/" >/dev/null 2>&1 || true
            sleep 1

            if curl "${OPSI[@]}" -T "$berkas" "$tujuan" 2>/tmp/galat-curl; then
              return 2
            fi

            return 1
          }

          while IFS= read -r -d '' berkas; do
            relatif="${berkas#./}"

            # PENTING: penjaga "|| hasil=$?" WAJIB ada. GitHub menjalankan
            # skrip dengan bash -e (errexit). Tanpa penjaga ini, nilai balik
            # non-nol dari fungsi akan langsung menghentikan seluruh skrip -
            # termasuk saat retry justru BERHASIL (nilai balik 2).
            hasil=0
            kirim "$berkas" "$relatif" || hasil=$?

            if [ "$hasil" -eq 0 ]; then
              SUKES=$((SUKES + 1))
              echo "  [ok]    $relatif"
            elif [ "$hasil" -eq 2 ]; then
              SUKES=$((SUKES + 1))
              echo "  [ok*]   $relatif  (file lama dihapus dulu, lalu unggah ulang)"
            else
              GAGAL=$((GAGAL + 1))
              BERKAS_GAGAL="${BERKAS_GAGAL}${relatif}\n"
              echo "  [GAGAL] $relatif"
              # Buang peringatan --ssl, itu bukan penyebab kegagalan.
              # "|| true" wajib: dengan pipefail + errexit, grep yang tidak
              # menemukan apa pun akan menghentikan skrip.
              grep -v -- 'insecure option' /tmp/galat-curl \
                | grep -v -- '^Warning: instead' | sed 's/^/            /' || true
            fi

          done < <(find . -type f -not -path './.git/*' -print0)
          {
            echo "### Hasil deploy"
            echo ""
            echo "- Berhasil: **$SUKES** file"
            echo "- Gagal: **$GAGAL** file"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GAGAL" -gt 0 ]; then
            {
              echo ""
              echo "<details><summary>Berkas gagal</summary><pre>"
              printf "$BERKAS_GAGAL"
              echo "</pre></details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$GAGAL file gagal di-upload."
            exit 1
          fi

          {
            echo ""
            echo "### Langkah manual (sekali saja, di server)"
            echo ""
            echo "1. Pastikan \`config/config.php\` sudah dibuat dan diisi kredensial DB"
            echo "2. Import \`deploy-moma_bread.sql\` lewat phpMyAdmin"
            echo "3. Set izin 755 untuk \`assets/img/uploads\` dan \`backups\`"
            echo "4. Login ke \`/admin\`, buka menu **Status Server**"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Selesai: $SUKES file terkirim."
