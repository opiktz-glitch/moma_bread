name: Deploy ke TinkerHost

# ---------------------------------------------------------------
#  Deploy otomatis ke TinkerHost lewat FTP.
#
#  TinkerHost tidak menyediakan terminal/SSH, jadi tidak bisa
#  "git pull" di server. Sebagai gantinya, file diambil dari
#  git archive lalu dikirim lewat FTP dari runner GitHub.
#
#  Karena sumbernya git archive, isinya PERSIS sama dengan isi
#  repository: config/config.php, backups/, dan .git/ tidak ikut.
# ---------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode latihan - daftar file tanpa meng-upload"
        type: boolean
        default: true

# Cegah dua deploy berjalan bersamaan.
concurrency:
  group: deploy-tinkerhost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload ke hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Susun daftar file dari git
        run: |
          set -euo pipefail

          echo "Commit : $(git log -1 --pretty=format:'%h %s')" >> "$GITHUB_STEP_SUMMARY"
          echo "Waktu  : $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # git archive hanya mengambil berkas yang benar-benar di-commit.
          git archive --format=tar HEAD | tar -x -C .

          # Pengaman: kredensial tidak boleh ikut terkirim.
          if [ -f config/config.php ]; then
            echo "::error::config/config.php ikut terambil. Deploy dibatalkan."
            exit 1
          fi

          JUMLAH=$(find . -type f -not -path './.git/*' | wc -l)
          UKURAN=$(du -sh --exclude=.git . | cut -f1)

          {
            echo "Jumlah file : $JUMLAH"
            echo "Total ukuran: $UKURAN"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "<details><summary>Daftar file ($JUMLAH)</summary><pre>"
            find . -type f -not -path './.git/*' | sed 's|^\./||' | sort
            echo "</pre></details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Siap meng-upload $JUMLAH file ($UKURAN)."

      - name: Periksa secret
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -euo pipefail

          # Secret dibaca lewat env. GitHub Actions tidak mendukung
          # nama secret yang berubah-ubah seperti secrets.$NAMA.
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ] || [ -z "$FTP_PATH" ]; then
            echo "::error::Secret belum lengkap. Buka Settings > Secrets and variables > Actions, lalu isi FTP_HOST, FTP_USER, FTP_PASS, dan FTP_PATH."
            exit 1
          fi

          echo "Secret lengkap. Host: $FTP_HOST, tujuan: $FTP_PATH"

      - name: Periksa folder tujuan
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          set -uo pipefail

          # Folder tujuan adalah kesalahan paling sering: TinkerHost Free
          # memakai "htdocs", sedangkan "public_html" hanya untuk paket Pro.
          # Salah path membuat SEMUA file gagal, jadi dicek lebih dulu.
          if curl --user "$FTP_USER:$FTP_PASS" \
                  --ssl --list-only "ftp://$FTP_HOST/${FTP_PATH%/}/" 2>/tmp/galat-folder; then
            echo "Folder $FTP_PATH ada dan bisa diakses."
          else
            echo "::error::Folder '$FTP_PATH' tidak bisa diakses di $FTP_HOST"
            sed 's/^/  /' /tmp/galat-folder
            {
              echo ""
              echo "### Folder tujuan tidak ditemukan"
              echo ""
              echo "| Paket | FTP host | Folder |"
              echo "|---|---|---|"
              echo "| Free (gratis) | \`ftpupload.net\` | \`/htdocs\` |"
              echo "| Pro (berbayar) | \`ftp.pro.tinkerhost.net\` | \`/public_html\` |"
              echo ""
              echo "Perbaiki secret \`FTP_PATH\`, lalu jalankan ulang."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Kirim lewat FTP
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
                    # --user dipakai, bukan kredensial yang disisipkan ke URL, supaya
                    # password dengan karakter khusus tetap aman.
                    HOST="${FTP_HOST%/}"
                    PATH_REMOTE="${FTP_PATH%/}"
                    PERAKARAN="."
                    SUKES=0

                    # Jeda antar berkas dan jumlah percobaan. Tanpa jeda, server bisa
                    # menolak sebagian permintaan karena terlalu cepat; gejalanya 451
                    # yang muncul pada berkas BERBEDA tiap kali deploy.
                    JJEDA="${DEPLOY_JEDA:-1}"
                    MAKS_PASS=3

                    OPSI=(--user "$FTP_USER:$FTP_PASS" --ftp-create-dirs --ssl
                          --silent --show-error --fail --connect-timeout 20 --max-time 300)

                    # Daftar berkas disimpan di ARRAY, bukan di berkas temporary.
                    # Memakai berkas temp menimbulkan dua bug: file temp ikut dieksekusi
                    # saat dihitung barisnya, dan isinya bisa rusak sehingga path temp
                    # terbaca sebagai nama berkas.
                    mapfile -t SISA < <(find . -type f -not -path './.git/*' | sed 's|^\./||' | sort)
                    TOTAL_AWAL=${#SISA[@]}

                    # Unggah satu berkas. Mengembalikan:
                    #   0 = langsung berhasil
                    #   2 = berhasil setelah file lama di server dihapus dulu
                    #   1 = gagal
                    #
                    # Balasan server saat mencoba menghapus disimpan di $KIRIM_DELE.
                    # Sebelumnya errornya dibuang ke /dev/null sehingga penyebab
                    # kegagalan tidak pernah terlihat.
                    KIRIM_DELE=""

                    kirim() {
                      relatif="$1"
                      sumber="$PERAKARAN/$relatif"

                      if curl "${OPSI[@]}" -T "$sumber" "ftp://$HOST$PATH_REMOTE/$relatif" 2>/tmp/galat-curl; then
                        return 0
                      fi

                      KIRIM_DELE="$(curl --user "$FTP_USER:$FTP_PASS" --ssl \
                                           -Q "DELE $PATH_REMOTE/$relatif" \
                                           --list-only "ftp://$HOST/" 2>&1 | head -2 | tr '\n' ' ')"
                      sleep 1

                      if curl "${OPSI[@]}" -T "$sumber" "ftp://$HOST$PATH_REMOTE/$relatif" 2>/tmp/galat-curl; then
                        return 2
                      fi

                      return 1
                    }

                    # Beberapa pass. Pass 1 mengunggah semua berkas; yang gagal
                    # dicoba ulang pada pass berikutnya dengan jeda lebih lama.
                    GAGAL=("${SISA[@]}")

                    for PASS in $(seq 1 $MAKS_PASS); do
                      [ ${#GAGAL[@]} -gt 0 ] || break

                      if [ "$PASS" -gt 1 ]; then
                        echo ""
                        echo "  -- Pass $PASS: mencoba ulang ${#GAGAL[@]} berkas --"
                      fi

                      BERIKUT=("${GAGAL[@]}")
                      GAGAL=()

                      for relatif in "${BERIKUT[@]}"; do
                        [ -z "$relatif" ] && continue

                        # "|| hasil=$?" melindungi pemanggilan fungsi dari errexit.
                        hasil=0
                        kirim "$relatif" || hasil=$?

                        if [ "$hasil" -eq 0 ]; then
                          SUKES=$((SUKES + 1))
                          [ "$PASS" -eq 1 ] && echo "  [ok]    $relatif"
                        elif [ "$hasil" -eq 2 ]; then
                          SUKES=$((SUKES + 1))
                          echo "  [ok*]   $relatif  (file lama dihapus dulu)"
                        else
                          GAGAL+=("$relatif")
                          if [ "$PASS" -eq 1 ]; then
                            echo "  [GAGAL] $relatif (akan dicoba lagi)"
                          fi
                        fi

                        [ "$JJEDA" != "0" ] && sleep "$JJEDA"
                      done
                    done

                    # Berkas yang masih gagal. PENTING: curl kode 18 berarti transfer
                    # TERPUTUS SEBAGIAN, jadi berkas di server bisa korup tanpa terlihat.
                    if [ ${#GAGAL[@]} -gt 0 ]; then
                      RUSAK=()
                      PETUNJUK=""

                      for relatif in "${GAGAL[@]}"; do
                        [ -z "$relatif" ] && continue

                        lokal=$(stat -c%s "$PERAKARAN/$relatif" 2>/dev/null || echo 0)

                        # --list-only dijalankan sekali, keluarannya dipakai dua kali:
                        # untuk membandingkan ukuran dan untuk membaca balasan server.
                        #
                        # "|| true" WAJIB: di bawah set -e, assignment yang berakhir
                        # non-nol akan menghentikan skrip - padahal perintah ini justru
                        # GAGAL saat server menolak, yaitu saat ringkasan dibutuhkan.
                        # Jangan pakai "|| jawaban=..." karena itu menimpa pesan error
                        # yang justru ingin ditampilkan.
                        jawaban=$(curl --user "$FTP_USER:$FTP_PASS" --ssl --list-only \
                                    "ftp://$HOST$PATH_REMOTE/$relatif" 2>&1) || true
                        jarak=$(echo "$jawaban" | awk 'NR==1 {print $5}')

                        if [ -n "$jarak" ] && [ "$jarak" = "$lokal" ]; then
                          echo "  [CEK]   $relatif - ukuran di server sudah benar ($jarak byte)"
                        else
                          echo "  [RUSAK] $relatif - lokal $lokal byte, server ${jarak:-tidak terbaca}"
                          RUSAK+=("$relatif")

                          # Bedakan sebab yang butuh tindakan berbeda.
                          if echo "$jawaban" | grep -qi 'denied'; then
                            PETUNJUK="${PETUNJUK}  ${relatif} -> server MENOLAK. Hapus manual lewat File Manager, lalu ulangi."$'\n'
                          elif echo "$jawaban" | grep -qi 'not found'; then
                            PETUNJUK="${PETUNJUK}  ${relatif} -> tidak ada di server dan tidak bisa dibuat. Periksa izin folder."$'\n'
                          else
                            PETUNJUK="${PETUNJUK}  ${relatif} -> $(echo "$jawaban" | head -1)"$'\n'
                          fi
                        fi
                      done

                      {
                        echo "### Hasil deploy"
                        echo ""
                        echo "- Berhasil: **$SUKES** dari $TOTAL_AWAL file"
                        echo "- Gagal: **${#GAGAL[@]}** file setelah $MAKS_PASS percobaan"
                      } >> "$GITHUB_STEP_SUMMARY"

                      {
                        echo ""
                        echo "<details><summary>Berkas gagal</summary><pre>"
                        printf '%s\n' "${RUSAK[@]}"
                        echo "</pre></details>"
                        echo ""
                        echo "### Balasan server"
                        echo ""
                        echo '```'
                        printf '%s' "$PETUNJUK"
                        echo '```'
                        echo ""
                        echo "Kalau server menolak, hapus file tersebut lewat **File Manager**"
                        echo "TinkerHost, lalu jalankan ulang workflow."
                      } >> "$GITHUB_STEP_SUMMARY"

                      echo "::error::${#GAGAL[@]} file gagal setelah $MAKS_PASS percobaan."
                      exit 1
                    fi

                    {
                      echo "### Hasil deploy"
                      echo ""
                      echo "- Berhasil: **$SUKES** dari $TOTAL_AWAL file"
                      echo "- Gagal: 0"
                    } >> "$GITHUB_STEP_SUMMARY"

                    {
                      echo ""
                      echo "### Langkah manual (sekali saja, di server)"
                      echo ""
                      echo "1. Pastikan \`config/config.php\` sudah dibuat dan diisi kredensial DB"
                      echo "2. Import \`deploy-moma_bread.sql\` lewat phpMyAdmin"
                      echo "3. Set izin 755 untuk \`assets/img/uploads\` dan \`backups\`"
                      echo "4. Login ke \`/admin\`, buka menu **Status Server**"
                    } >> "$GITHUB_STEP_SUMMARY"

                    echo "Selesai: $SUKES dari $TOTAL_AWAL file terkirim."
