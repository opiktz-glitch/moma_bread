name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Upload ke FTP
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Deploy ke Server via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASS }}
        server-dir: ${{ secrets.FTP_PATH }}/
        exclude: |
          **/.git*
          **/.git*/**
          config/config.php
          backups/**
          tools/**
          .github/**
          DEPLOY-INFINITYFREE.md
          README.md
