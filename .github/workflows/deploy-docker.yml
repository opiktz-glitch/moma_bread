name: Deploy Moma Bread ke Docker Windows

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-moma-bread-docker
  cancel-in-progress: false

jobs:
  deploy:
    name: Update server Windows
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: Deploy aplikasi
        shell: cmd
        run: call "C:\TZ_FIles\Moma_bread\update.bat"
